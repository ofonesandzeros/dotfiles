# Enable automatic renaming
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}:#{pane_current_command}"

# Global bar background (Sleek dark charcoal)
set -g status-style "bg=#262626"

# 🟢 ACTIVE WINDOW: Uses a bright green solid arrow block
set -g window-status-current-format "#[fg=#262626,bg=#00ff87]#[fg=#1a1a1a,bold] #I  #W #[fg=#00ff87,bg=#262626]"

# ⚪ INACTIVE WINDOW: Uses a low-key gray aesthetic with thin arrows
set -g window-status-format "#[fg=#808080] #I  #W #[fg=#444444]"
